<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antislop Rewriter</title>
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1d1b17;--mute:#6e675b;--line:#e2dccf;--acc:#2f6f5e;--acc2:#e9f2ee;--bad:#a8432f;--bad2:#f7e7e2;--warn:#8a6a12;--warn2:#f6efd9}
@media (prefers-color-scheme:dark){:root{--bg:#15140f;--card:#1e1c17;--ink:#ece6da;--mute:#a39b8c;--line:#34302a;--acc:#6fc0a6;--acc2:#1d2e28;--bad:#e58b77;--bad2:#3a221d;--warn:#e0c26a;--warn2:#332b17}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font:600 26px/1.2 ui-serif,Georgia,serif;margin:0;letter-spacing:-.01em}
h1 small{font:400 14px ui-sans-serif,system-ui;color:var(--mute);margin-left:8px}
.status{font-size:13px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--acc)}.dot.no{background:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
textarea{width:100%;min-height:340px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;background:transparent;color:var(--ink);font:15px/1.55 inherit;font-family:inherit}
textarea:focus,input:focus{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
label{font-size:13px;color:var(--mute)}
input[type=text]{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:transparent;color:var(--ink);font:inherit;font-size:14px}
select,input[type=range]{accent-color:var(--acc)}
select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
button{border:0;border-radius:10px;padding:10px 18px;font:600 15px inherit;font-family:inherit;cursor:pointer;background:var(--acc);color:#fff}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line);padding:6px 12px;font-size:13px;font-weight:500}
button:disabled{opacity:.5;cursor:default}
.meta{font-size:13px;color:var(--mute)}
.variant{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;background:var(--card)}
.variant .text{white-space:pre-wrap}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--ink)}
.badge.h{background:var(--acc2);color:var(--acc)}.badge.ai{background:var(--bad2);color:var(--bad)}.badge.mx{background:var(--warn2);color:var(--warn)}
.err{color:var(--bad);font-size:14px;margin-top:10px;white-space:pre-wrap}
.empty{color:var(--mute);font-size:14px;padding:30px 6px;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Antislop Rewriter <small>antislop (pg120) · rawmodels</small></h1>
    <div class="status"><span id="st-model"><span class="dot"></span>модель…</span><span id="st-pg"></span></div>
  </header>
  <div class="grid">
    <section class="card">
      <textarea id="src" placeholder="Вставь текст, который нужно переписать по-человечески…"></textarea>
      <div class="meta" id="srcmeta">0 слов</div>
      <div class="row">
        <label>Вариантов <select id="variants"><option>1</option><option>2</option><option selected>3</option></select></label>
        <label>Режим <select id="mode"><option value="careful">Бережно — структура и факты</option><option value="free" selected>Свободно — как живой комментарий</option></select></label>
        <label>Смелость <input type="range" id="temp" min="0.5" max="1.0" step="0.05" value="0.85"> <span id="tempv">0.85</span></label>
      </div>
      <div class="row"><label><input type="checkbox" id="auto" checked> Автопроверка Pangram: пробовать до <select id="autoN"><option>3</option><option selected>6</option><option>9</option></select> вариантов, пока не пройдёт (~$0.06 за 100 слов на попытку)</label></div>
      <div class="row"><input type="text" id="extra" placeholder="Доп. указание (необязательно): напр. «это отзыв на кофейню», «пиши от первого лица»"></div>
      <div class="row">
        <button id="go">Переписать</button>
        <span class="meta">Длинные тексты переписываются кусками по ~200 слов.</span>
      </div>
      <div class="err" id="err"></div>
    </section>
    <section>
      <div id="out"><div class="card empty">Здесь появятся варианты. У каждого можно проверить настоящим Pangram (~$0.15 за 200 слов).</div></div>
    </section>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const words=t=>(t.match(/[\p{L}\p{N}'’-]+/gu)||[]).length;
$('#src').addEventListener('input',()=>{$('#srcmeta').textContent=words($('#src').value)+' слов'});
$('#temp').addEventListener('input',()=>{$('#tempv').textContent=(+$('#temp').value).toFixed(2)});
async function status(){
  try{const s=await (await fetch('/api/status')).json();
    $('#st-model').innerHTML=`<span class="dot ${s.model_up?'ok':'no'}"></span>${s.model} ${s.model_up?'онлайн':'недоступна'}`;
    $('#st-pg').textContent=s.pangram_key?`Pangram потрачено $${s.pangram_spent.toFixed(2)}`:'нет ключа Pangram';
  }catch(e){$('#st-model').innerHTML='<span class="dot no"></span>сервер недоступен'}
}
status();setInterval(status,20000);
function esc(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function badge(r){
  const cls=r.headline==='Human Written'?'h':(r.headline==='AI Generated'?'ai':'mx');
  const hum=r.fraction_human!=null?` · human ${(r.fraction_human*100).toFixed(0)}%`:'';
  return `<span class="badge ${cls}">${esc(r.headline||'?')}${hum}</span>`;
}
$('#go').addEventListener('click',async()=>{
  const text=$('#src').value.trim(); $('#err').textContent='';
  if(words(text)<5){$('#err').textContent='Нужен текст хотя бы из нескольких слов.';return}
  const b=$('#go'); b.disabled=true; b.innerHTML='<span class="spin"></span>Пишу…';
  $('#out').innerHTML='<div class="card empty"><span class="spin"></span>Модель переписывает…</div>';
  try{
    const r=await fetch('/api/rewrite',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text,variants:+$('#variants').value,temperature:+$('#temp').value,extra:$('#extra').value,mode:$('#mode').value,auto:$('#auto').checked?+$('#autoN').value:0})});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||r.status);
    const head=d.tries?`<div class="card meta" style="margin-bottom:14px">${d.passed?'✅ Нашёл вариант, который Pangram считает человеческим':'❌ Ни один вариант не прошёл'} · попыток ${d.tries} · всего потрачено на Pangram $${d.spent_total.toFixed(2)}</div>`:'';
    $('#out').innerHTML=head+d.variants.map((v,i)=>`<div class="variant" data-i="${i}">
      <div class="vhead"><strong>Вариант ${i+1}</strong><span class="meta">${v.words} слов из ${d.source_words}${d.chunks>1?` · ${d.chunks} кусков`:''}</span>
      <span><button class="ghost copy">Копировать</button> ${v.pangram?'':'<button class="ghost pg">Проверить Pangram</button>'} <span class="res">${v.pangram?(v.pangram.error?esc(v.pangram.error):badge(v.pangram)):''}</span></span></div>
      <div class="text">${esc(v.text)}</div></div>`).join('');
    document.querySelectorAll('.variant').forEach((el,i)=>{
      const t=d.variants[i].text;
      el.querySelector('.copy').onclick=async e=>{await navigator.clipboard.writeText(t);e.target.textContent='Скопировано'};
      const pgb=el.querySelector('.pg'); if(pgb) pgb.onclick=async e=>{
        const btn=e.target; btn.disabled=true; btn.innerHTML='<span class="spin"></span>Pangram…';
        try{const pr=await fetch('/api/pangram',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
          const pd=await pr.json(); if(!pr.ok) throw new Error(pd.error);
          el.querySelector('.res').innerHTML=badge(pd); btn.remove(); status();
        }catch(err){btn.disabled=false;btn.textContent='Проверить Pangram';el.querySelector('.res').textContent=err.message}
      };
    });
  }catch(e){$('#out').innerHTML='';$('#err').textContent=e.message}
  b.disabled=false; b.textContent='Переписать';
});
</script>
</body>
</html>
